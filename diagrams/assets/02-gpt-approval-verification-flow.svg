<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850">
<rect width="1440" height="850" fill="#ffffff"/><text x="65" y="80" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#102a43">CloudGenius | GPT-to-Azure deployment flow</text><text x="65" y="118" font-family="Arial,sans-serif" font-size="19" fill="#52667b">Actual Script 2 workflow • Microsoft Foundry GPT-5-mini • Approval required</text>
<rect x="65" y="165" width="1310" height="108" rx="16" fill="#eaf3fc" stroke="#c5dbee"/><circle cx="124" cy="219" r="31" fill="#0868c9"/><text x="124" y="230" font-family="Arial" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">1</text><text x="185" y="197" font-family="Arial" font-size="21" font-weight="700" fill="#102a43">PREPARE</text><text x="185" y="227" font-family="Arial" font-size="19" fill="#2c455c">PowerShell loads the Script 1 config,</text><text x="185" y="253" font-family="Arial" font-size="19" fill="#2c455c">verifies the subscription and proposes a unique Storage name.</text><path d="M720 273 v20" stroke="#0874d5" stroke-width="4" /><path d="M710 285 l10 11 10 -11" fill="none" stroke="#0874d5" stroke-width="4"/><rect x="65" y="294" width="1310" height="108" rx="16" fill="#f2f7fb" stroke="#c5dbee"/><circle cx="124" cy="348" r="31" fill="#0868c9"/><text x="124" y="359" font-family="Arial" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">2</text><text x="185" y="326" font-family="Arial" font-size="21" font-weight="700" fill="#102a43">REQUEST GPT TOOL CALL</text><text x="185" y="356" font-family="Arial" font-size="19" fill="#2c455c">PowerShell sends deploy_storage_account schema to Foundry.</text><text x="185" y="382" font-family="Arial" font-size="19" fill="#2c455c">GPT returns a function_call with storage_name and call_id.</text><path d="M720 402 v20" stroke="#0874d5" stroke-width="4" /><path d="M710 414 l10 11 10 -11" fill="none" stroke="#0874d5" stroke-width="4"/><rect x="65" y="423" width="1310" height="108" rx="16" fill="#eaf3fc" stroke="#c5dbee"/><circle cx="124" cy="477" r="31" fill="#0868c9"/><text x="124" y="488" font-family="Arial" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">3</text><text x="185" y="455" font-family="Arial" font-size="21" font-weight="700" fill="#102a43">VALIDATE + APPROVE</text><text x="185" y="485" font-family="Arial" font-size="19" fill="#2c455c">PowerShell verifies the exact name and Azure availability.</text><text x="185" y="511" font-family="Arial" font-size="19" fill="#2c455c">The administrator must type APPROVE; otherwise creation stops.</text><path d="M720 531 v20" stroke="#0874d5" stroke-width="4" /><path d="M710 543 l10 11 10 -11" fill="none" stroke="#0874d5" stroke-width="4"/><rect x="65" y="552" width="1310" height="108" rx="16" fill="#f2f7fb" stroke="#c5dbee"/><circle cx="124" cy="606" r="31" fill="#0868c9"/><text x="124" y="617" font-family="Arial" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">4</text><text x="185" y="584" font-family="Arial" font-size="21" font-weight="700" fill="#102a43">DEPLOY + VERIFY</text><text x="185" y="614" font-family="Arial" font-size="19" fill="#2c455c">Azure CLI creates secure StorageV2 using fixed policy.</text><text x="185" y="640" font-family="Arial" font-size="19" fill="#2c455c">PowerShell checks Azure provisioning and security properties.</text><path d="M720 660 v20" stroke="#0874d5" stroke-width="4" /><path d="M710 672 l10 11 10 -11" fill="none" stroke="#0874d5" stroke-width="4"/><rect x="65" y="681" width="1310" height="108" rx="16" fill="#eaf3fc" stroke="#c5dbee"/><circle cx="124" cy="735" r="31" fill="#0868c9"/><text x="124" y="746" font-family="Arial" text-anchor="middle" font-size="31" font-weight="700" fill="#fff">5</text><text x="185" y="713" font-family="Arial" font-size="21" font-weight="700" fill="#102a43">REPORT RESULT</text><text x="185" y="743" font-family="Arial" font-size="19" fill="#2c455c">The verified tool output returns to Foundry using call_id.</text><text x="185" y="769" font-family="Arial" font-size="19" fill="#2c455c">GPT writes the final report; Azure is the source of truth.</text>
<rect x="65" y="814" width="1310" height="28" rx="8" fill="#0b5cab"/><text x="720" y="834" font-family="Arial" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">GPT requests  •  Human authorizes  •  PowerShell enforces  •  Azure executes and verifies</text>
</svg>